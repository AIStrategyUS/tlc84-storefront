<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 1200px; overflow: hidden; }
  body {
    background:
      radial-gradient(circle at 22% 18%, rgba(255,255,255,0.35), rgba(255,255,255,0) 40%),
      radial-gradient(circle at 80% 85%, rgba(0,0,0,0.08), rgba(0,0,0,0) 45%),
      linear-gradient(135deg, #f3ead9 0%, #e8dcc4 45%, #ded0ae 100%);
    position: relative;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  /* subtle woven-linen texture */
  body::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
  }
  .magnet {
    position: absolute;
    border-radius: 50%;
    box-shadow:
      0 18px 34px rgba(40, 30, 10, 0.28),
      0 4px 8px rgba(40, 30, 10, 0.18);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .magnet::after {
    /* glossy highlight arc */
    content: "";
    position: absolute; inset: 0; border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.12) 28%, rgba(255,255,255,0) 45%);
    pointer-events: none;
  }
  .magnet::before {
    content: "";
    position: absolute; inset: 0; border-radius: 50%;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.12), inset 0 -6px 10px rgba(0,0,0,0.10);
    pointer-events: none;
    z-index: 5;
  }
  .face { position: absolute; inset: 0; display:flex; align-items:center; justify-content:center; flex-direction:column; border-radius:50%; }
  .pinback {
    position: absolute;
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, #cfd6d2, #8f9a94);
    box-shadow: 0 3px 6px rgba(0,0,0,0.35), inset 0 0 0 2px rgba(255,255,255,0.4);
  }
  .stem {
    position: absolute; width: 3px; height: 130px; background: linear-gradient(#0002,#0000);
  }
  svg { display:block; }
</style>
</head>
<body>
<div id="scene"></div>
<script>
const params = new URLSearchParams(location.search);
const product = params.get('p') || 'birth-month';
const scene = document.getElementById('scene');

function magnet({x, y, size, rotate, z=1, pin=false, faceHtml}) {
  const el = document.createElement('div');
  el.className = 'magnet';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  el.style.transform = `rotate(${rotate}deg)`;
  el.style.zIndex = z;
  el.innerHTML = `<div class="face">${faceHtml}</div>`;
  if (pin) {
    const clasp = document.createElement('div');
    clasp.className = 'pinback';
    clasp.style.left = (size * 0.70) + 'px';
    clasp.style.top = (size * 0.66) + 'px';
    el.appendChild(clasp);
  }
  scene.appendChild(el);
}

function textFace(bg, color, text, font, size, sub) {
  return `<div style="width:100%;height:100%;background:${bg};display:flex;align-items:center;justify-content:center;flex-direction:column;color:${color};font-family:${font};text-align:center;padding:10%;">
    <div style="font-size:${size}px;line-height:1.05;">${text}</div>
    ${sub ? `<div style="font-size:${size*0.28}px;letter-spacing:2px;text-transform:uppercase;margin-top:8px;opacity:0.75;">${sub}</div>` : ''}
  </div>`;
}

const FLOWER_SVGS = {
  sunflower: `<svg viewBox="0 0 100 100" width="72%" height="72%">
    <g fill="#E8A93A">${Array.from({length:12}).map((_,i)=>`<ellipse cx="50" cy="18" rx="8" ry="20" transform="rotate(${i*30} 50 50)"/>`).join('')}</g>
    <circle cx="50" cy="50" r="16" fill="#6B4A2A"/>
  </svg>`,
  rose: `<svg viewBox="0 0 100 100" width="70%" height="70%">
    <circle cx="50" cy="50" r="26" fill="#E8AFC0"/>
    <circle cx="50" cy="50" r="17" fill="#DE8FA8"/>
    <circle cx="50" cy="50" r="9" fill="#C96488"/>
    <g fill="#7FA06B"><ellipse cx="26" cy="72" rx="14" ry="6" transform="rotate(-20 26 72)"/><ellipse cx="74" cy="72" rx="14" ry="6" transform="rotate(20 74 72)"/></g>
  </svg>`,
  daisy: `<svg viewBox="0 0 100 100" width="72%" height="72%">
    <g fill="#FFFFFF" stroke="#e7e2d6" stroke-width="1">${Array.from({length:10}).map((_,i)=>`<ellipse cx="50" cy="20" rx="7" ry="22" transform="rotate(${i*36} 50 50)"/>`).join('')}</g>
    <circle cx="50" cy="50" r="14" fill="#E8A93A"/>
  </svg>`,
  lily: `<svg viewBox="0 0 100 100" width="72%" height="72%">
    <g fill="#F3C6D8">${Array.from({length:6}).map((_,i)=>`<ellipse cx="50" cy="22" rx="10" ry="26" transform="rotate(${i*60} 50 50)"/>`).join('')}</g>
    <circle cx="50" cy="50" r="8" fill="#B8895F"/>
  </svg>`,
};

function flowerFace(bg, key) {
  return `<div style="width:100%;height:100%;background:${bg};display:flex;align-items:center;justify-content:center;">${FLOWER_SVGS[key]}</div>`;
}

function sportFace(bg, iconType, label) {
  const icons = {
    soccer: `<svg viewBox="0 0 100 100" width="52%" height="52%"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#222" stroke-width="2"/><polygon points="50,28 65,40 59,58 41,58 35,40" fill="#222"/></svg>`,
    football: `<svg viewBox="0 0 100 60" width="60%" height="36%"><ellipse cx="50" cy="30" rx="46" ry="26" fill="#8a5a2b" stroke="#4a2f14" stroke-width="2"/><line x1="20" y1="30" x2="80" y2="30" stroke="#fff" stroke-width="2"/><line x1="40" y1="22" x2="40" y2="38" stroke="#fff" stroke-width="2"/><line x1="50" y1="20" x2="50" y2="40" stroke="#fff" stroke-width="2"/><line x1="60" y1="22" x2="60" y2="38" stroke="#fff" stroke-width="2"/></svg>`,
    basketball: `<svg viewBox="0 0 100 100" width="52%" height="52%"><circle cx="50" cy="50" r="46" fill="#d97b3f" stroke="#3a2213" stroke-width="2"/><line x1="4" y1="50" x2="96" y2="50" stroke="#3a2213" stroke-width="2"/><line x1="50" y1="4" x2="50" y2="96" stroke="#3a2213" stroke-width="2"/><path d="M15,15 Q50,50 15,85" fill="none" stroke="#3a2213" stroke-width="2"/><path d="M85,15 Q50,50 85,85" fill="none" stroke="#3a2213" stroke-width="2"/></svg>`,
  };
  return `<div style="width:100%;height:100%;background:${bg};display:flex;align-items:center;justify-content:center;flex-direction:column;">
    ${icons[iconType]}
    <div style="font-family:Georgia,serif;font-weight:bold;letter-spacing:3px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.4);margin-top:6px;font-size:22px;">${label}</div>
  </div>`;
}

function flagFace(size) {
  const stars = Array.from({length:7}).map((_,i)=>`<text x="${8+ (i%4)*9}" y="${16 + Math.floor(i/4)*14}" font-size="10" fill="#fff">&#9733;</text>`).join('');
  return `<div style="width:100%;height:100%;position:relative;background:repeating-linear-gradient(#B22234 0 20px, #fff 20px 40px);">
    <div style="position:absolute;top:0;left:0;width:55%;height:55%;background:#3C3B6E;">
      <svg viewBox="0 0 60 60" width="100%" height="100%">${stars}</svg>
    </div>
  </div>`;
}

function christmasFace(bg, iconType) {
  const icons = {
    tree: `<svg viewBox="0 0 100 110" width="46%" height="55%">
      <polygon points="50,6 72,42 28,42" fill="#3f7652"/>
      <polygon points="50,30 78,66 22,66" fill="#3f7652"/>
      <polygon points="50,54 85,94 15,94" fill="#2f5a3e"/>
      <rect x="44" y="94" width="12" height="12" fill="#7a4a2b"/>
      <circle cx="50" cy="10" r="5" fill="#E8A93A"/>
      <circle cx="38" cy="50" r="4" fill="#C24B4B"/>
      <circle cx="62" cy="58" r="4" fill="#E8A93A"/>
      <circle cx="46" cy="76" r="4" fill="#C24B4B"/>
      <circle cx="66" cy="82" r="4" fill="#E8D9A9"/>
    </svg>`,
    ornament: `<svg viewBox="0 0 100 100" width="46%" height="46%">
      <rect x="44" y="8" width="12" height="10" fill="#8f9a94"/>
      <circle cx="50" cy="55" r="34" fill="#C24B4B" stroke="#8a2f2f" stroke-width="2"/>
      <path d="M20,45 Q50,60 80,45" fill="none" stroke="#E8D9A9" stroke-width="4"/>
    </svg>`,
  };
  return `<div style="width:100%;height:100%;background:${bg};display:flex;align-items:center;justify-content:center;">${icons[iconType]}</div>`;
}

function abcTile(bg, char, fontPx) {
  return `<div style="width:100%;height:100%;background:${bg};border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:'Arial Rounded MT Bold',Arial,sans-serif;font-weight:900;color:#fff;font-size:${fontPx}px;text-shadow:0 2px 0 rgba(0,0,0,0.15);">${char}</div>`;
}

const layouts = {

  'custom-photo-pins': () => {
    const scenes = [
      // sunset
      `<div style="width:100%;height:100%;background:linear-gradient(180deg,#f6c453 0%,#e8845a 55%,#c8562f 100%);position:relative;overflow:hidden;">
         <div style="position:absolute;left:50%;top:38%;width:34%;height:34%;transform:translate(-50%,-50%);border-radius:50%;background:#fff3d6;box-shadow:0 0 30px rgba(255,240,200,0.8);"></div>
         <div style="position:absolute;bottom:0;left:0;right:0;height:38%;background:#7a3a2e;clip-path:polygon(0% 60%,20% 40%,40% 55%,60% 30%,80% 50%,100% 35%,100% 100%,0% 100%);"></div>
       </div>`,
      // ocean horizon
      `<div style="width:100%;height:100%;background:linear-gradient(180deg,#bfe0ee 0%,#8fc7dd 45%,#2f6f8f 46%,#1c4f6b 100%);"></div>`,
      // mountain silhouette
      `<div style="width:100%;height:100%;background:linear-gradient(180deg,#d8ecec 0%,#cfe4d8 40%,#eef2e4 100%);position:relative;overflow:hidden;">
         <div style="position:absolute;bottom:0;left:0;right:0;height:55%;background:#5c7a5c;clip-path:polygon(0% 100%,10% 40%,28% 70%,45% 20%,60% 55%,78% 30%,100% 65%,100% 100%);"></div>
         <div style="position:absolute;bottom:0;left:0;right:0;height:30%;background:#3f5a45;clip-path:polygon(0% 100%,15% 60%,35% 85%,55% 45%,75% 80%,100% 55%,100% 100%);"></div>
       </div>`,
      // floral field
      `<div style="width:100%;height:100%;background:linear-gradient(180deg,#f7e6ee 0%,#f3d3e2 100%);position:relative;overflow:hidden;">
         <div style="position:absolute;bottom:-10%;left:0;right:0;height:50%;background:#7fa06b;border-radius:50% 50% 0 0 / 100% 100% 0 0;"></div>
       </div>`,
    ];
    const pos = [[130,120,300,-10],[560,90,280,6],[300,430,320,-6],[700,470,260,10]];
    pos.forEach((p,i)=>magnet({x:p[0],y:p[1],size:p[2],rotate:p[3],z:i, pin:true, faceHtml:scenes[i]}));
  },

  'birth-month-flower-magnets': () => {
    const bgs = ['#fdf6e8','#fdeef2','#eef6ea','#fdf6e8'];
    const keys = ['sunflower','rose','daisy','lily'];
    const pos = [[120,110,320,-8],[560,80,290,7],[300,440,310,-5],[700,460,270,9]];
    pos.forEach((p,i)=>magnet({x:p[0],y:p[1],size:p[2],rotate:p[3],z:i,faceHtml:flowerFace(bgs[i],keys[i])}));
  },

  'bible-verse-magnets': () => {
    const words = [['Grace','#f6efe2','#3f5a45'],['Be Still','#eef2ec','#345240'],['Joy','#f7e9df','#7a4a2b'],['Fearfully &\nWonderfully\nMade','#eef6ea','#3f5a45']];
    const pos = [[130,120,300,-8],[560,90,280,6],[300,440,300,-6],[690,450,280,8]];
    pos.forEach((p,i)=>{
      const [word,bg,color]=words[i];
      const size = word.length>10 ? 26 : 46;
      magnet({x:p[0],y:p[1],size:p[2],rotate:p[3],z:i,faceHtml:textFace(bg,color,word.replace(/\n/g,'<br>'),'Georgia,serif',size,null)});
    });
  },

  'sport-fan-magnets-and-pins': () => {
    const bgs = ['linear-gradient(160deg,#3f7652,#274e35)','linear-gradient(160deg,#8a3f3f,#5c2323)','linear-gradient(160deg,#3a5a8a,#1f3556)','linear-gradient(160deg,#8a6a2b,#5c4415)'];
    const cfgs = [['soccer','MOM'],['football','#7'],['basketball','DAD'],['soccer','GRANDMA']];
    const pos = [[130,120,300,-8],[560,90,280,6],[300,440,300,-6],[700,460,270,9]];
    pos.forEach((p,i)=>magnet({x:p[0],y:p[1],size:p[2],rotate:p[3],z:i,faceHtml:sportFace(bgs[i],cfgs[i][0],cfgs[i][1])}));
  },

  'patriotic-magnets': () => {
    const pos = [[130,120,300,-8],[560,90,280,6],[300,440,300,-6],[700,460,270,9]];
    pos.forEach((p,i)=>magnet({x:p[0],y:p[1],size:p[2],rotate:p[3],z:i,faceHtml:flagFace(p[2])}));
  },

  'christmas-coloring-magnets': () => {
    const bgs = ['#fdf6e8','#f7ece2','#fdf6e8','#f7ece2'];
    const icons = ['tree','ornament','tree','ornament'];
    const pos = [[130,120,300,-8],[560,90,280,6],[300,440,300,-6],[700,460,270,9]];
    pos.forEach((p,i)=>magnet({x:p[0],y:p[1],size:p[2],rotate:p[3],z:i,faceHtml:christmasFace(bgs[i],icons[i])}));
  },

  'punny-magnet-gift-set': () => {
    const puns = [['You’re','kind of a','big DILL','#f6efe2','#7a4a2b'],['LETTUCE','be','friends','#eef6ea','#3f5a45'],['OLIVE','you','','#f7e9df','#7a4a2b'],['You’re','one in a','MELON','#fdeef2','#8a3f5f'],['DONUT','worry,','be happy','#eef2ec','#345240'],['TOAST','to you!','','#fdf6e8','#7a4a2b']];
    const pos = [[90,110,210,-8],[330,90,200,6],[560,120,200,-5],[90,390,210,8],[330,410,200,-6],[560,400,210,5]];
    pos.forEach((p,i)=>{
      const [l1,l2,l3,bg,color]=puns[i];
      magnet({x:p[0],y:p[1],size:p[2],rotate:p[3],z:i,faceHtml:`<div style="width:100%;height:100%;background:${bg};display:flex;align-items:center;justify-content:center;flex-direction:column;color:${color};font-family:Georgia,serif;text-align:center;padding:12%;">
        <div style="font-size:20px;">${l1}</div><div style="font-size:20px;">${l2}</div><div style="font-size:24px;font-weight:bold;">${l3}</div>
      </div>`});
    });
  },

  'abc-123-magnet-kit': () => {
    const chars = ['A','B','3','C','7','2','K','5'];
    const colors = ['#C24B4B','#3f7652','#3a6ea5','#E8A93A','#8a5aa5','#d97b3f','#4a8a8a','#b85f8e'];
    const size = 220;
    const fontPx = Math.round(size * 0.56);
    const pos = [[110,110,-12],[360,80,8],[610,130,-6],[860,90,10],[160,380,9],[420,410,-8],[670,360,7],[130,650,-10]];
    pos.forEach((p,i)=>{
      const el = document.createElement('div');
      el.style.position='absolute'; el.style.left=p[0]+'px'; el.style.top=p[1]+'px';
      el.style.width=size+'px'; el.style.height=size+'px'; el.style.transform=`rotate(${p[2]}deg)`;
      el.style.boxShadow = '0 16px 30px rgba(40,30,10,0.3)';
      el.style.borderRadius='20px';
      el.innerHTML = abcTile(colors[i], chars[i], fontPx);
      scene.appendChild(el);
    });
  },

};

(layouts[product] || layouts['birth-month-flower-magnets'])();
document.body.dataset.ready = '1';
</script>
</body>
</html>
